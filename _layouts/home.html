---
layout: default
---
<header>
  <h1>{{ site.title }}</h1>
  {%-if site.theme_config.show_description-%}
    <p>{{ site.description }}</p>
  {%-endif-%}
</header>

{%-include nav.html-%}

{%- if page.photo -%}
<div class="profile">
  <img class="profile-photo" src="{{ page.photo | relative_url }}" alt="{{ site.author }}" />
  <div class="profile-text">
    {{ content }}
  </div>
</div>
{%- else -%}
  {{ content }}
{%- endif -%}

{%-include contact.html-%}
